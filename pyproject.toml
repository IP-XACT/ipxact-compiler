[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ipxact-compiler"
version = "0.1.0"
description = "Parses IEEE 1685-2022 IP-XACT XML into a Python object model."
license = { text = "LGPL-3.0-only" }
requires-python = ">=3.9"
dependencies = [
    "lxml",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ipxact = ["py.typed"]
